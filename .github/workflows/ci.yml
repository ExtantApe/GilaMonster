name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Leak check (emails and build output; private terms are only checked locally)
        run: bash scripts/leak-check.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build every product, including the gilamonster-session client the checks drive
        run: swift build
      - name: Tests, including the server lifecycle against a stand-in jar
        run: swift run gilamonster-check
      - name: The checks that need a real TCP port on 127.0.0.1 (left out of the default run, K817)
        run: swift run gilamonster-check --with-ports
      - name: The build refuses to delete a bundle something is running from
        run: scripts/test-build-guard.sh
      - name: Release builds stop servers at a Mac shutdown too
        run: scripts/test-release-quit.sh
      - name: The app builds and bundles
        run: scripts/build-app.sh
